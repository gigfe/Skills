services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    env_file:
      - ./backend/.env
    ports:
      - '4000:4000'
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - '80:80'
    depends_on:
      - backend
    restart: unless-stopped

  # A diferencia de SQL Server, Postgres en contenedor Linux es un target de
  # producción razonable (no solo para dev). Si el hosting ofrece Postgres
  # gestionado (RDS, Neon, Supabase, Azure Database for PostgreSQL), comentar
  # este servicio y apuntar DATABASE_URL al endpoint gestionado en su lugar.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
