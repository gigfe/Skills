# Se copia a <proyecto>/.github/workflows/ci-cd.yml SOLO cuando el usuario pide
# preparar el proyecto para producción — no es parte del scaffolding inicial
# (ver "Preparar un proyecto para producción" en SKILL.md).
#
# Build + lint + typecheck + test corren siempre en push/PR a main. El job de
# deploy queda comentado hasta que el target de infraestructura esté decidido
# (ver references/deployment.md) — activarlo a mano reemplazando los pasos de
# ejemplo por los reales del target elegido. Esta skill nunca ejecuta
# `git push`, `gh` ni configura secrets remotos: eso es manual del usuario en
# GitHub → Settings → Secrets and variables → Actions.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npx tsc --noEmit
      # Descomentar cuando el proyecto tenga un test runner configurado:
      # - run: npm test
      - run: npm run build

  frontend:
    name: Frontend — lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npx tsc --noEmit
      # Descomentar cuando el proyecto tenga un test runner configurado:
      # - run: npm test
      - run: npm run build

