server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback SPA: cualquier ruta no encontrada devuelve index.html
    # (necesario para rutas anidadas de React Router al refrescar/entrar directo)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy al backend — el nombre "backend" es el del servicio en docker-compose.yml.
    # En un target sin Docker reemplazar por la URL/puerto real.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets estáticos con hash en el nombre (Vite) — cache largo
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
}
